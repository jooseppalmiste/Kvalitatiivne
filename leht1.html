<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nõid Nastaja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2b173d;
      color: white;
      margin: 0;
      text-align: center;
    }

    header {
      background: #5b2c83;
      padding: 25px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 42px;
    }

    .nastaja-img {
      width: 180px;
      max-width: 80%;
      border: 3px solid white;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: #3a2050;
      padding: 20px;
      margin-bottom: 25px;
      border: 2px solid white;
    }

    .prices {
      text-align: left;
      display: inline-block;
      font-size: 18px;
      line-height: 1.8;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 80%;
      max-width: 300px;
    }

    button {
      display: block;
      margin: 15px auto;
      padding: 10px 20px;
      font-size: 16px;
      background: #d7a8ff;
      border: 2px solid white;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .good {
      color: #9cff9c;
    }

    .bad {
      color: #ff9c9c;
    }
  </style>
</head>

<body>

<header>
  <h1>🔮 NÕID NASTAJA 🔮</h1>
  <img
    class="nastaja-img"
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSITKGN8yjAlygtvQDVmuUsyebNqVrrHN03bzozHxyB8LvBFcDWDdGwzLzH&s=10"
    alt="Nõid Nastaja"
  >
</header>

<main>

  <div class="box">
    <h2>Hinnakiri</h2>

    <div class="prices">
      Kiirennustus – 5 €<br>
      Kaardipanek – 15 €<br>
      Tuleviku ennustus – 30 €
    </div>
  </div>

  <div class="box">
    <h2>Tuleviku ennustaja</h2>

    <p>Vali kuupäev:</p>

    <input type="date" id="dateInput">

    <button onclick="tellFortune()">ENNUSTA</button>

    <div id="result"></div>
  </div>

</main>

<script>
  const days = [
    "pühapäev",
    "esmaspäev",
    "teisipäev",
    "kolmapäev",
    "neljapäev",
    "reede",
    "laupäev"
  ];

  const good = [
    "Sinu tulevik on hea. Aga võid ikka tulla vastuvõtule."
  ];

  const bad = [
    "Sinu tulevikus on näha raskusi. TULE KOHE VASTUVÕTULE!",
  ];

  function tellFortune() {
    const input = document.getElementById("dateInput").value;
    const result = document.getElementById("result");

    if (!input) {
      result.className = "";
      result.innerHTML = "Vali kõigepealt kuupäev!";
      return;
    }

    const date = new Date(input + "T12:00:00");
    const weekday = days[date.getDay()];

    const isGood = Math.random() < 0.5;
    const list = isGood ? good : bad;
    const fortune = list[Math.floor(Math.random() * list.length)];

    result.className = isGood ? "good" : "bad";
    result.innerHTML = "See kuupäev on " + weekday + ".<br><br>" + fortune;
  }
</script>

</body>
</html>
